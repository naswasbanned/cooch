<div class="stack">
  <div class="alert alert--success" role="status"><svg class="icon" aria-hidden="true"><use href="#i-check-circle"></use></svg><div class="alert__body"><span class="alert__title">Pengaturan tersimpan</span><span>Dipakai lagi pada game berikutnya.</span></div></div>
  <div class="alert alert--warning" role="status"><svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg><div class="alert__body"><span class="alert__title">Pemain terlalu sedikit</span><span>Tambah minimal 3 pemain untuk mulai.</span></div></div>
  <div class="alert alert--error" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-x-circle"></use></svg><div class="alert__body"><span class="alert__title">Sesi tidak ditemukan</span><span>Mulai game baru dari katalog.</span></div></div>
  <div class="alert" role="status"><svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg><div class="alert__body"><span class="alert__title">Tip</span><span>Layar tetap menyala selama game berjalan.</span></div></div>
  <div class="cluster">
    <button class="btn btn--sm" type="button" data-toast="Pengaturan tersimpan" data-toast-type="success">Toast sukses</button>
    <button class="btn btn--sm btn--danger" type="button" data-toast="Nama pemain tidak boleh kosong" data-toast-type="error">Toast error</button>
    <button class="btn btn--sm btn--secondary" type="button" data-toast="Giliran Rani" data-toast-type="info">Toast info</button>
  </div>
</div>
