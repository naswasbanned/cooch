<div>

  <dialog class="modal" id="demo-modal" aria-labelledby="demo-modal-title">
    <div class="modal__inner">
      <span class="modal__handle" aria-hidden="true"></span>
      <div class="modal__header">
        <h2 class="modal__title" id="demo-modal-title">Akhiri game ini?</h2>

      <p class="modal__body">Progres game akan hilang. Pengaturan pemain tetap tersimpan.</p>

      </div>
    </div>
