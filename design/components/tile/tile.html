<div class="stack">
  <div class="tile-grid" role="group" aria-label="Papan contoh">
    <button class="tile tile--selected" type="button" aria-label="Kartu terbuka: topeng"><svg class="icon" aria-hidden="true"><use href="#i-mask"></use></svg></button>
    <button class="tile" type="button">2</button>
    <button class="tile" type="button">3</button>
    <button class="tile" type="button">4</button>
    <button class="tile" type="button">5</button>
    <button class="tile tile--open" type="button" aria-label="Kartu terbuka: bulan"><svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg></button>
    <button class="tile tile--matched" type="button" disabled aria-label="Sudah cocok">7</button>
    <button class="tile" type="button">8</button>
  </div>
  <div class="action-bar">
    <button class="btn btn--icon btn--xl" type="button" aria-label="Kembali"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg></button>
    <button class="btn btn--icon btn--xl" type="button" aria-label="Jeda"><svg class="icon" aria-hidden="true"><use href="#i-pause"></use></svg></button>
    <button class="btn btn--icon btn--xl" type="button" aria-label="Bantuan"><svg class="icon" aria-hidden="true"><use href="#i-bolt"></use></svg></button>
  </div>
</div>
