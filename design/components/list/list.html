<div class="stack">
  <div class="sheet">
    <ul class="menu-list">
      <li class="menu-list__item"><a class="menu-list__link" href="#"><span class="menu-list__icon"><svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg></span><span class="menu-list__text">Pengaturan</span><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg></a></li>
      <li class="menu-list__item"><a class="menu-list__link" href="#"><span class="menu-list__icon"><svg class="icon" aria-hidden="true"><use href="#i-help"></use></svg></span><span class="menu-list__text">Aturan game</span><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg></a></li>
      <li class="menu-list__item"><button class="menu-list__link menu-list__link--danger" type="button"><span class="menu-list__icon"><svg class="icon" aria-hidden="true"><use href="#i-logout"></use></svg></span><span class="menu-list__text">Akhiri sesi</span></button></li>
    </ul>
  </div>
  <div class="streak" aria-label="Main 5 dari 7 hari">
    <div class="streak__day streak__day--done">Jum<span class="streak__mark"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-check"></use></svg></span></div>
    <div class="streak__day streak__day--done">Sab<span class="streak__mark"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-check"></use></svg></span></div>
    <div class="streak__day streak__day--done">Min<span class="streak__mark"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-check"></use></svg></span></div>
    <div class="streak__day streak__day--done">Sen<span class="streak__mark"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-check"></use></svg></span></div>
    <div class="streak__day streak__day--done">Sel<span class="streak__mark"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-check"></use></svg></span></div>
    <div class="streak__day">Rab<span class="streak__mark"></span></div>
    <div class="streak__day">Kam<span class="streak__mark"></span></div>
  </div>
  <div class="podium">
    <div class="podium__place podium__place--2"><span class="avatar avatar--sky">S</span><span class="podium__name">Susi</span><span class="points"><svg class="icon icon--fill icon--sm" aria-hidden="true"><use href="#i-coin"></use></svg>12</span><span class="podium__block">2</span></div>
    <div class="podium__place podium__place--1"><span class="avatar avatar--lg avatar--ring">D</span><span class="podium__name">Dimas</span><span class="points"><svg class="icon icon--fill icon--sm" aria-hidden="true"><use href="#i-coin"></use></svg>18</span><span class="podium__block">1</span></div>
    <div class="podium__place podium__place--3"><span class="avatar avatar--grape">Y</span><span class="podium__name">Yanti</span><span class="points"><svg class="icon icon--fill icon--sm" aria-hidden="true"><use href="#i-coin"></use></svg>9</span><span class="podium__block">3</span></div>
  </div>
  <ol class="rank-list">
    <li class="rank-row"><span class="rank-row__pos">4</span><span class="avatar avatar--sm avatar--leaf">M</span><span class="rank-row__name">Mira</span><span class="trend trend--up">+4</span><span class="points"><svg class="icon icon--fill icon--sm" aria-hidden="true"><use href="#i-coin"></use></svg>8</span></li>
    <li class="rank-row rank-row--me"><span class="rank-row__pos">5</span><span class="avatar avatar--sm avatar--sun">R</span><span class="rank-row__name">Rani (kamu)</span><span class="trend trend--up">+1</span><span class="points"><svg class="icon icon--fill icon--sm" aria-hidden="true"><use href="#i-coin"></use></svg>6</span></li>
    <li class="rank-row"><span class="rank-row__pos">6</span><span class="avatar avatar--sm">B</span><span class="rank-row__name">Bayu</span><span class="trend trend--down">-2</span><span class="points"><svg class="icon icon--fill icon--sm" aria-hidden="true"><use href="#i-coin"></use></svg>5</span></li>
    <li class="rank-row rank-row--out"><span class="rank-row__pos">-</span><span class="avatar avatar--sm avatar--grape">A</span><span class="rank-row__name">Andi</span><span class="badge badge--error">Tereliminasi</span></li>
  </ol>
</div>
