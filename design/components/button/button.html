<div class="stack">
  <div class="cluster">
    <button class="btn" type="button">Mulai Main</button>
    <button class="btn btn--secondary" type="button">Aturan</button>
    <button class="btn btn--accent" type="button">Pilih Peran</button>
    <button class="btn btn--ghost" type="button">Batal</button>
    <button class="btn btn--danger" type="button">Akhiri Game</button>
  </div>
  <div class="cluster">
    <button class="btn btn--sm" type="button">Kecil</button>
    <button class="btn" type="button">Sedang</button>
    <button class="btn btn--lg" type="button">Besar</button>
    <button class="btn btn--xl" type="button">Mulai Voting</button>
  </div>
  <div class="cluster">
    <button class="btn" type="button"><svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>Main Lagi</button>
    <button class="btn btn--secondary" type="button">Lanjut<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></button>
    <button class="btn btn--icon btn--round" type="button" aria-label="Pengaturan"><svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg></button>
  </div>
  <div class="cluster">
    <button class="btn" type="button" disabled>Disabled</button>
    <button class="btn btn--secondary" type="button" aria-busy="true">Memuat</button>
    <button class="btn btn--ghost" type="button" disabled>Ghost disabled</button>
  </div>
  <p class="field__hint">Aksi game (bar bawah, ikon persegi):</p>
  <div class="btn-group">
    <button class="btn btn--icon btn--xl" type="button" aria-label="Kembali"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg></button>
    <button class="btn btn--icon btn--xl" type="button" aria-label="Jeda"><svg class="icon" aria-hidden="true"><use href="#i-pause"></use></svg></button>
    <button class="btn btn--icon btn--xl" type="button" aria-label="Bantuan cepat"><svg class="icon" aria-hidden="true"><use href="#i-bolt"></use></svg></button>
  </div>
  <button class="btn btn--block btn--lg" type="button">Tombol Penuh Satu Layar</button>
</div>
